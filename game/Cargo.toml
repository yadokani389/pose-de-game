[package]
edition = "2024"
name = "pose-de-game"
version = "0.1.0"

[dependencies]
anyhow = "1.0.100"
bevy = "0.17.3"
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
serde_cbor = "0.11.2"

async-broadcast = "0.7.2"
bevy-wasm-tasks = { git = "https://github.com/yadokani389/bevy-wasm-tasks", features = [
  "tokio",
] }
bevy_egui = "0.38"
bevy_ggrs = "0.19"
futures = "0.3.31"
iroh = { version = "0.35", default-features = false }
iroh-gossip = { version = "0.35", default-features = false, features = ["net"] }
matchbox_socket = { version = "0.13", features = ["ggrs"] }
n0-future = "0.1.3"
nokhwa = { version = "0.10.10", features = ["input-native"] }
serde_json = "1.0.140"
tokio = "1.45.0"
uuid = { version = "1.16.0", features = ["v4", "rng-getrandom"] }
web-time = "1.1.0"
